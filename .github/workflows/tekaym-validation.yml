name: Tekaym Online validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install worker
        working-directory: worker
        run: npm install
      - name: Validate release manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('release.json','utf8'));
          const v=String(r.version||'').toUpperCase();
          if(!/^V[1-9][0-9]*$/.test(v))throw new Error('Invalid Tekaym version: '+v);
          if(r.releaseId!==v||r.clientVersion!==v||r.game!=='Tekaym Online')throw new Error('Release metadata mismatch');
          if(r.databaseSchema!==1)throw new Error('Database schema mismatch');
          console.log('Release OK -> '+v);
          NODE
      - name: Check Worker syntax
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/tekaym-worker-dry-run
      - name: Check client structure
        run: |
          test -f index.html
          test -f release.json
          test -f src/main.js
          test -f src/config.js
          test -f src/prison.js
          test -f worker/src/index.js
          test -f worker/wrangler.jsonc
          test -f firestore.rules
          echo 'Tekaym structure OK'
      - name: Validate offline playable demo JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('recursos-prueba/demo-jugable/index.html', 'utf8');
          const script = html.match(/<script type="module">([\\s\\S]*?)<\\/script>/);
          if (!script) throw new Error('Playable demo module not found');
          for (const id of ['play','attackButton','stickBase','cameraToggle','map']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Demo control missing: ' + id);
          }
          fs.writeFileSync('/tmp/tekaym-demo.mjs', script[1]);
          console.log('Playable demo structure OK');
          NODE
          node --check /tmp/tekaym-demo.mjs
      - name: Check isolation
        run: |
          if git grep -nE 'DarkPixel|neon_core|neon_release|neon_force|neon_reload|serverVersion|SERVER_VERSION|Belmo' -- ':!README.md' ':!docs/**' ':!recursos-prueba/**' ':!.github/workflows/tekaym-validation.yml'; then
            echo 'Forbidden cross-project/server traces found'; exit 1;
          fi
      - name: Check version synchronization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('release.json','utf8'));
          const html=fs.readFileSync('index.html','utf8');
          const cfg=fs.readFileSync('src/config.js','utf8');
          if(!html.includes('Tekaym Online'))throw new Error('Game title missing');
          if(!html.includes('V1'))throw new Error('Client version marker missing');
          if(!cfg.includes("GAME_VERSION='V1'"))throw new Error('Client config version missing');
          if(!r.clientPath.includes('/index.html'))throw new Error('Client path invalid');
          console.log('Version synchronization OK -> '+r.version);
          NODE
