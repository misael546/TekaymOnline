name: Tekaym Online validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server
        working-directory: server
        run: npm install
      - name: Validate release manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('release.json','utf8'));
          const v=String(r.version||'').toUpperCase();
          if(!/^V[1-9][0-9]*$/.test(v))throw new Error('Invalid Tekaym version: '+v);
          if(r.releaseId!==v||r.clientVersion!==v||r.game!=='Tekaym Online')throw new Error('Release metadata mismatch');
          console.log('Release OK -> '+v);
          NODE
      - name: Check syntax
        run: |
          node --check server/server.js
          node --check server/firestore-storage.js
          node --check server/google-auth.js
          node --check server/storage.js
          node --check src/main.js
          node --check src/config.js
          node --check src/prison.js
      - name: Check isolation
        run: |
          if git grep -nE 'DarkPixel|neon_core|neon_release|neon_force|neon_reload|serverVersion|SERVER_VERSION' -- ':!README.md' ':!docs/**' ':!.github/workflows/tekaym-validation.yml'; then
            echo 'Forbidden cross-project/version traces found'; exit 1;
          fi
      - name: Check structure
        run: |
          test -f index.html
          test -f release.json
          test -f src/main.js
          test -f src/config.js
          test -f src/prison.js
          test -f server/server.js
          test -f server/package.json
          test -f firestore.rules
          echo 'Tekaym structure OK'
